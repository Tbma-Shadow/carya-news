name: Deploy Carya News
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: carya-news-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: fde00bf244c1cffa8130e7c82345e6d1
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm ci --prefix frontend
      - run: npm test && npm test --prefix frontend && npm run build
      - run: npx wrangler d1 migrations apply carya-news --remote
      - run: npx wrangler deploy
      - run: node scripts/build-pages.mjs
      - name: Deploy Pages from outside Worker configuration directory
        run: cd pages-deploy && ../node_modules/.bin/wrangler pages deploy ../pages --project-name carya-news --branch main --no-bundle --commit-hash "$GITHUB_SHA"
